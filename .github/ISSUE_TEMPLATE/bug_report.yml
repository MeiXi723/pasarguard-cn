name: 🐛 安装 / 运行报错
description: 脚本跑不起来、服务起不来、面板打不开
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**填得越具体，定位越快。**

        提之前请先花 30 秒确认这三件事，能自己解决掉大部分问题：

        1. 云厂商控制台的**安全组 / 防火墙**放行了面板端口吗？
        2. 服务器本机 `curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/` 是 200 吗？
        3. 你看过 README 里的「[已知限制](https://github.com/MeiXi723/pasarguard-cn#已知限制)」吗？

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我确认云厂商安全组已放行面板端口（TCP）
          required: true
        - label: 我已阅读 README 的「已知限制」和「中文排障」
          required: true
        - label: 我贴的是**完整**日志，不是只言片语
          required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 这个脚本只在 Debian 12 上完整实测过，其他系统可能有问题
      options:
        - Debian 12（完整实测）
        - Debian 11
        - Debian 13
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Ubuntu 20.04
        - 其他（请在下文说明）
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 卡在哪一步
      description: 脚本会打印 `━━ 步骤名 ━━`，选最后显示的那一步
      options:
        - 环境检查
        - 配置国内镜像加速
        - 获取官方安装脚本
        - 安装 PasarGuard 面板
        - 安全加固
        - 创建管理员账号
        - 配置 nginx HTTPS 反代
        - 安装节点
        - 端到端自检
        - 验收
        - 装完了，但用起来有问题（面板/订阅/客户端）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 脚本版本 / 提交
      description: |
        在仓库目录跑 `git log -1 --oneline` 拿到
      placeholder: "例如 4034b0e"
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: 你执行的命令
      description: 完整命令，包括参数
      render: shell
      placeholder: sudo bash pg-cn.sh -y --panel-port 9443
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 关键日志（最后 30~50 行）
      description: |
        重新跑一次并保存输出：

        ```bash
        sudo bash pg-cn.sh -y 2>&1 | tail -50
        ```

        **不要只贴一行报错**，上下文才看得出问题。
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: |
        有用的信息：

        - 服务器配置（几核几 G）
        - 是否装过 PasarGuard / Marzban（会残留数据卷和容器）
        - 有没有改过 `/opt/pasarguard/docker-compose.yml`
        - `docker ps -a` 的输出
    validations:
      required: false
